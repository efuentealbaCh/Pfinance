services:
  # ─── Base de Datos PostgreSQL ───────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: pfinance_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: pfinance
      POSTGRES_USER: pfinance_user
      POSTGRES_PASSWORD: pfinance_secret
    ports:
      - "5432:5432"
    volumes:
      - pfinance_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pfinance_user -d pfinance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Backend (NestJS) ──────────────────────────────────────
  backend-js:
    build:
      context: ./backend-js
      dockerfile: Dockerfile
    container_name: pfinance_backend_js
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./backend-js:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://pfinance_user:pfinance_secret@db:5432/pfinance?schema=public
    command: npm run start:dev
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend React + TypeScript (Vite) ─────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pfinance_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev -- --host
volumes:
  pfinance_db_data:
